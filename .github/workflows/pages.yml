name: 트렌드 수집 및 Pages 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: "40 22 * * *"  # 매일 07:40 KST (= 22:40 UTC). 깃허브 지연을 감안해 8시 전에 끝나도록 일찍 시작
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: 데이터 수집 및 정적 사이트 생성
        run: python3 collect.py _site
        env:
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v5
